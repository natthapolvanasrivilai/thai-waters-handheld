<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210"><style>text{font:3.4px sans-serif;fill:#222}rect,path{fill:none;stroke:#222;stroke-width:0.32}.score{stroke:#26738c;stroke-dasharray:2 1}.bay{stroke:#999;stroke-dasharray:1 1}</style>
<text x="15" y="9">PK2 / cut three separate dividers. Solid = cut. Dashed = score. Glue each foot to the carton floor.</text>
<rect x="15" y="15" width="221" height="56"/>
<path class="score" d="M15 63h221"/>
<text x="18" y="24">A / across full width</text>
<text x="18" y="30">221 x 56 mm</text>
<rect x="15" y="82" width="87.5" height="56"/>
<path class="score" d="M15 130h87.5"/>
<text x="18" y="91">B / front to A</text>
<text x="18" y="97">87.5 x 56 mm</text>
<rect x="115" y="82" width="52.0" height="56"/>
<path class="score" d="M115 130h52.0"/>
<text x="118" y="91">C / rear to A</text>
<text x="118" y="97">52.0 x 56 mm</text>
<text x="15" y="152">Score 8 mm from the foot. Form 90 degrees. Set the finished inside faces to the floor drawing.</text>
<text x="15" y="160">A foot faces the grip. B foot faces the cable. C foot faces the key. Trim the foot only at junctions.</text>
<path d="M15 190v4m0 -2h50m0 -2v4"/>
<text x="15" y="199">50 mm scale check</text>
</svg>
