<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riffle Pocket · Product handbook</title>
<style>
@font-face{font-family:Atkinson;src:url(data:font/ttf;base64,@@FONT@@);font-weight:200 800}*{box-sizing:border-box}body{margin:0;color:#19352d;background:#f3f1e9;font:16px/1.42 Atkinson,Arial,sans-serif}a{color:#086654}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd6c1e;outline-offset:2px}header{padding:24px clamp(18px,5vw,72px) 29px;background:#163e35;color:#f7f4e7}header .nameplate{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #708d7a;padding-bottom:12px;color:#c8d9c9}.nameplate strong{font-size:17px}.nameplate span{font-size:13px}h1{font-size:clamp(32px,5vw,57px);letter-spacing:-.045em;line-height:1;margin:24px 0 8px}header p{margin:0;color:#d3dfd0}nav{position:sticky;z-index:3;top:0;display:flex;padding:0 clamp(12px,4vw,64px);overflow:auto;background:#f3f1e9;border-bottom:1px solid #bbc8bb;gap:8px}nav button{white-space:nowrap;background:transparent;border:0;border-bottom:3px solid transparent;padding:14px 10px 11px;font-weight:600}nav button[aria-current=true]{border-color:#1c6a50;color:#13533e}main{max-width:1460px;margin:auto;padding:25px clamp(16px,4vw,64px) 50px}h2{font-size:clamp(25px,3.3vw,37px);letter-spacing:-.035em;line-height:1.07;margin:0 0 12px}h3{font-size:22px;line-height:1.2;margin:23px 0 9px;letter-spacing:-.022em}h4{margin:7px 0;font-size:15px}p{max-width:96ch;margin:7px 0 13px}.lede{font-size:18px;color:#4c6459}.meta{color:#51695e;font-size:14px}.tiles,.columns{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:16px 0}.card,details,.sheet{background:#fbfaf5;border:1px solid #c4cfc0;border-radius:10px;padding:15px}.card>b{display:block;font-size:26px;letter-spacing:-.03em}.warn{border-left:4px solid #ae5c27;padding:12px 16px;background:#fae9ce;border-radius:4px}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,42%);align-items:center;gap:18px}.hero img{width:100%;border-radius:12px}.toolbar{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px;margin:17px 0}.toolbar label{display:grid;gap:3px;font-size:14px}.toolbar input,.toolbar select,.cmd,summary{border:1px solid #9aac9b;background:#fffdf7;border-radius:6px;padding:7px 10px}.cmd{display:inline-block;text-decoration:none;font-weight:600;color:#224c3b}.cmd.primary{background:#1c5442;color:white}.gridtable{overflow:auto;max-width:100%;border:1px solid #c9d2c6;border-radius:7px;background:#fcfbf6}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.35}th{color:#365146;background:#e0e8db;text-align:left;vertical-align:bottom}td,th{padding:8px;border-bottom:1px solid #dce3d8;vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#f2f5eb}td:first-child{font-weight:600}.yes,.bad,.neutral{display:inline-block;padding:2px 7px;border-radius:5px;font-size:12px;white-space:nowrap;background:#dfeddf;color:#215839}.bad{background:#f9dfca;color:#813b16}.neutral{background:#e8e9df;color:#4b5547}details{margin:9px 0;padding:0}details summary{border:0;cursor:pointer;font-weight:650;background:transparent;padding:11px 14px}details>div{padding:0 14px 13px}.viewbox{width:100%;height:min(84vh,880px);min-height:510px;border:1px solid #a7b9a9;border-radius:12px;background:#eaf0e5}.unit{font-variant-numeric:tabular-nums}.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:16px 0}.flow div{background:#e2ebe0;border-top:3px solid #467863;padding:9px}.flow strong{display:block}input[type=range]{accent-color:#42765d}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px}.metric{border-bottom:1px solid #c5d3c6;padding:6px 0}.metric strong{display:block;font-size:20px}.gauge{font-variant-numeric:tabular-nums;color:#153f34;font-weight:700;font-size:30px}.limit{color:#496655;font-size:12px}#wave{width:100%;height:190px;background:#edf4e9;border-radius:8px}#wave polyline{fill:none;stroke:#16745a;stroke-width:2;vector-effect:non-scaling-stroke}#wave text{font:11px Atkinson,Arial;fill:#3a4c40}.empty{color:#68421b}.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;background:#d4ddcf}.stack span:nth-child(1){background:#39735a}.stack span:nth-child(2){background:#d99b61}.stack span:nth-child(3){background:#759b95}#printReport{display:none}footer{border-top:1px solid #bbc9ba;color:#5c6c60;padding:15px clamp(18px,5vw,72px);font-size:13px}ul,ol{padding-left:23px}li{margin:4px 0}[hidden]{display:none!important}
@media(max-width:740px){.hero{grid-template-columns:1fr}.hero img{max-height:220px;object-fit:contain}.viewbox{min-height:540px}nav{gap:0}nav button{padding:11px 7px;font-size:14px}.nameplate{gap:15px}main{padding-top:18px}table{min-width:500px}}
@page{size:A4;margin:15mm 13mm 18mm}@media print{body{font:10pt/1.36 Atkinson,Arial;color:#17392d;background:white}header,nav,main,footer{display:none}#printReport{display:block}#printReport h1{font-size:34pt}#printReport h2{font-size:21pt;border-bottom:1px solid #82a18c;padding-bottom:5px}#printReport h3{font-size:14pt;margin:12px 0 5px}#printReport article{break-before:page}#printReport article:first-child{break-before:auto}#printReport p{max-width:none}#printReport .tiles{gap:5px}#printReport .card{padding:6px}#printReport table{font-size:8.3pt;min-width:0}#printReport td,#printReport th{padding:4px 5px}#printReport tr{break-inside:avoid}#printReport thead{display:table-header-group}#printReport .gridtable{overflow:visible;border:0}#printReport .sheet{break-inside:avoid;padding:9px}#printReport img{max-width:100%;max-height:89mm;object-fit:contain}.warn{break-inside:avoid}h3,h4{break-after:avoid}.limit{font-size:8pt}#printReport .bad,#printReport .yes,#printReport .neutral{font-size:7.4pt}.lede{font-size:11pt}a{text-decoration:none;color:inherit}}
@media print{#printReport td,#printReport td a{overflow-wrap:anywhere}#printReport .gridtable{max-width:100%}#printReport article:nth-child(3),#printReport article:nth-child(11),#printReport article:nth-child(14),#printReport article:nth-child(15){break-before:auto;padding-top:5mm}}
</style>
<header><div class="nameplate"><strong>Riffle Pocket</strong><span>Personal engineering project · Rev F</span></div><h1>Product handbook</h1><p>Thai Waters · engineering, gameplay and manufacturing</p></header>
<nav id="tabs" aria-label="Engineering review"></nav><main><section id="overview"></section><section id="assembly" hidden></section><section id="circuits" hidden></section><section id="validation" hidden></section><section id="software" hidden></section><section id="demo" hidden></section><section id="factory" hidden></section><section id="business" hidden></section></main><div id="printReport"></div><footer>Engineering candidate · Results apply to the recorded configurations and model assumptions.</footer>
<script id="reviewData" type="application/json">@@DATA@@</script><script id="compressedGame" type="application/octet-stream">@@GAME@@</script><script id="compressedModel" type="application/octet-stream">@@MODEL@@</script><script>
'use strict';
const D=JSON.parse(document.getElementById('reviewData').textContent);
const $=id=>document.getElementById(id),html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>typeof n==='number'?new Intl.NumberFormat('en-US',{maximumSignificantDigits:5}).format(n):String(n??'—'),usd=n=>Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const allTabs={overview:'Contents',demo:'Playable demo',assembly:'3D assembly',circuits:'Circuits',software:'Software',validation:'Test plan',factory:'Assembly process',business:'BOM & business'};
const tbl=(heads,rows)=>'<div class="gridtable"><table><thead><tr>'+heads.map(h=>'<th scope="col">'+html(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const cellTable=(heads,rows)=>tbl(heads,rows.map(r=>r.map(html)));
const textList=items=>'<ul>'+items.map(x=>'<li>'+html(x)+'</li>').join('')+'</ul>';
const cards=items=>'<div class="tiles">'+items.map(([v,t])=>'<div class="card"><b>'+html(v)+'</b>'+html(t)+'</div>').join('')+'</div>';
const source=(url,label)=>/^https?:\/\//i.test(url||'')?'<a target="_blank" rel="noopener noreferrer" href="'+html(url)+'">'+html(label||'Source')+'</a>':html(label||url);
const outcome=s=>'<span class="'+(s==='WITHIN'?'yes':s==='OUTSIDE'?'bad':'neutral')+'">'+html(s)+'</span>';
const limits=m=>!m.limits?'Characterization':m.limits.filter(v=>v!==null).length===0?'Characterization':m.limits[0]===null?'≤ '+num(m.limits[1]):m.limits[1]===null?'≥ '+num(m.limits[0]):num(m.limits[0])+' to '+num(m.limits[1]);
const checks=D.circuits.cases.flatMap(c=>c.metrics.map(m=>({...m,caseId:c.id,family:c.family})));
const exceptions=checks.filter(m=>m.status==='OUTSIDE');
const intro='<p class="warn"><strong>Disposition: engineering samples only.</strong> Production release depends on the battery envelope and charging protection, measured closed-case performance, supplier controls, and market-specific qualification. No physical result has been entered in this review.</p>';
const topology='<div class="flow"><div><strong>USB-C / cell</strong>J7 pack and power path</div><div><strong>AXP2101</strong>Rails, charge and gauge</div><div><strong>ESP32-S3</strong>Radio, clock and game</div><div><strong>Inputs</strong>Touch, IMU and reel</div><div><strong>Outputs</strong>LCD, speaker and motor</div></div>';
const controlsTable=()=>cellTable(['Risk','Control','Closure test'],D.risks.map(r=>[r.Risk,r['Critical control'],r['Closure evidence']]));
const circuitTable=ms=>tbl(['Case','Measurement','Result','Criterion','Disposition'],ms.map(m=>[html(m.caseId),html(m.label),html(num(m.value)+' '+m.unit),html(limits(m)+(m.limits?' '+m.unit:'')),outcome(m.status)]));
const architecture=()=>cellTable(['System','Hardware and connections','Firmware','Test IDs'],D.arch.map(r=>[r.Function,r['Hardware realization'],r['Software binding'],r.Verification]));
const stages=()=>cellTable(['Station','Operations and control','Equipment','Record'],D.routing.map(r=>[r.Station+' · '+r.Process,r['Control and inspection'],r.Equipment,r['Record or release']]));
const markets=()=>tbl(['Market / topic','Design implication','Evidence to release'],D.markets.map(r=>[source(r.URL,r['Market or gate']),html(r['What it changes for this design']),html(r['Release evidence'])]));
const matrix=rows=>rows.map(r=>'<details><summary>'+html(r.ID+' · '+r.System)+' <span class="neutral">'+html(r.Gate)+'</span></summary><div><h4>'+html(r.Risk)+'</h4><p>'+html(r['Evidence now'])+'</p><p>'+html(r['Test method'])+'</p><p><b>Acceptance.</b> '+html(r['Acceptance and record'])+'</p><small>'+html(r.Owner)+'</small></div></details>').join('');
const clearanceTable=()=>cellTable(['Nominal pair or stack','CAD value','Interpretation'],D.fit.map(x=>x));
const docs='<div class="toolbar"><button class="cmd" id="print">Print complete report</button><button class="cmd" id="download">Download unit test record</button></div>';
$('overview').innerHTML='<div class="hero"><div><h2>Engineering release decision</h2>'+intro+'<p>Inspect the full assembly, review circuit predictions against their stated limits, and follow the tests that close each production risk.</p></div><img alt="Rev F handheld with detachable rod grip and right-side folding reel" src="'+D.hero+'"></div>'+cards([[D.circuits.cases.length,'Simulated circuit cases'],[exceptions.length,'Outside modeled criteria'],[D.validation.length,'Qualification protocols'],[D.bom.length,'Buy/make and packout lines']])+topology+'<h3>Priority decisions</h3>'+textList(D.decisions)+'<h3>Architecture and interfaces</h3>'+architecture()+docs;
$('assembly').innerHTML='<h2>Populated Rev F assembly</h2><p class="lede">Rotate the assembly and move the explode control. Use the part list to inspect individual components, cable routes and model provenance.</p><iframe title="Rev F exploded mechanical assembly viewer" id="viewer" class="viewbox" loading="lazy"></iframe><h3>Critical dimensions</h3>'+clearanceTable()+'<h3>Fit disposition</h3>'+textList(D.fitNotes);
async function loadViewer(){
 if($('viewer').dataset.loaded)return;$('viewer').dataset.loaded='1';
 try{const encoded=$('compressedModel').textContent.trim();
 const bytes=Uint8Array.from(atob(encoded),ch=>ch.charCodeAt(0));
 const page=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 $('viewer').srcdoc=page;}catch{$('viewer').src='Riffle-Rev-F-exploded.html';}
}
$('circuits').innerHTML='<h2>Electrical corner analysis</h2><p>'+html(D.engineNote)+'</p>'+cards([[D.circuits.cases.length,'Standalone decks'],[checks.length,'Measured model outputs'],[exceptions.length,'Outside criteria']])+'<label>Choose a circuit case <select id="casePick"></select></label><div class="sheet" id="caseDetail"></div><h3>Cases requiring action</h3>'+(exceptions.length?circuitTable(exceptions):'<p>All bounded metrics meet their modeled criteria. Characterization items still require hardware acceptance.</p>')+'<h3>Battery life sensitivity</h3><p>Use pack-side average current measured in play. This estimate reserves a user-selected fraction of nameplate capacity for cutoff and aging.</p><div class="toolbar"><label>Pack current, mA<input type="number" min="1" max="2500" value="200" id="draw"></label><label>Usable capacity, %<input type="number" min="1" max="100" value="85" id="usable"></label><output class="gauge" id="runtime"></output></div><p class="meta">Initial values are illustrative. Nominal battery energy is 1.2 Ah × 3.7 V = 4.44 Wh.</p>';
D.circuits.cases.forEach((c,i)=>$('casePick').add(new Option(c.id+' · '+c.description,i)));
function renderCase(){
 const c=D.circuits.cases[+$('casePick').value];if(!c)return;
 $('caseDetail').innerHTML='<h3>'+html(c.family)+'</h3><p>'+html(c.description)+'</p><div class="metrics">'+c.metrics.map(m=>'<div class="metric"><span>'+html(m.label)+'</span><strong>'+html(num(m.value)+' '+m.unit)+'</strong>'+outcome(m.status)+' <span class="limit">'+html(limits(m))+'</span></div>').join('')+'</div><h4>Model and scope</h4><p>'+html(c.model)+'</p><small>'+html(c.deck)+'</small>';
}
$('casePick').onchange=renderCase;renderCase();
function calcRuntime(){const i=+$('draw').value,f=+$('usable').value;$('runtime').textContent=i>0&&f>0&&f<=100?(1200*f/100/i).toFixed(1)+' h':'Enter valid inputs';}
$('draw').oninput=$('usable').oninput=calcRuntime;calcRuntime();
$('validation').innerHTML='<h2>Qualification plan</h2><p>Open a test for its method, acceptance evidence and owner. The unit record collects measurements by serial, fixture, hardware lot and firmware digest.</p><div class="toolbar"><label>Gate<select id="gate"><option>All</option><option>EVT</option><option>DVT</option><option>PVT</option></select></label><label>Find test<input type="search" id="searchTest" placeholder="Battery, reel, OTA…"></label><output id="testCount"></output></div><div id="testRows"></div><h3>Market access</h3>'+markets();
function showTests(){const q=$('searchTest').value.toLowerCase(),g=$('gate').value,rows=D.validation.filter(r=>(g==='All'||g===r.Gate)&&Object.values(r).join(' ').toLowerCase().includes(q));$('testCount').textContent=rows.length+' tests';$('testRows').innerHTML=matrix(rows)||'<p>No matching tests.</p>';}
$('gate').onchange=$('searchTest').oninput=showTests;showTests();
$('factory').innerHTML='<h2>Build and test sequence</h2><p>'+html(D.productionIntro)+'</p>'+stages()+'<h3>Critical failure modes</h3>'+controlsTable()+'<h3>Firmware release and recovery</h3>'+textList(D.firmware);
function download(){const href=URL.createObjectURL(new Blob([D.blankRecord],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=href;a.download='Riffle-Rev-F-unit-record.csv';a.click();setTimeout(()=>URL.revokeObjectURL(href),1500);}
$('download').onclick=download;
</script>
@@TAIL@@
</html>
