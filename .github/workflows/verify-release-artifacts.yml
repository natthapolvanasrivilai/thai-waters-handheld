name: Verify release artifacts (one-off #62 diagnosis only)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact historical browser artifact commit (259accc… only)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  reload_boundary:
    if: github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.ref == 'refs/heads/diagnostic/reload-62-exact-once' && inputs.source_sha == '259acccfeefd0523a40f33ff60d33f8131eefe0e'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECT_BROWSER_VERSION: '151.0.7922.34'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '44859468101'
          artifact-ids: "14688961699"
          merge-multiple: true
          path: ${{ runner.temp }}/exact-browser-input
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify immutable input and run four paired cohorts
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          test "$(git rev-parse 'HEAD^1')" = 259acccfeefd0523a40f33ff60d33f8131eefe0e
          test "$(git rev-parse 'HEAD^1^{tree}')" = 31e017cfead6e9c9a85e631731af835ccdb512b4
          bundle="$RUNNER_TEMP/exact-browser-input"
          (
            cd "$bundle"
            sha256sum -c --strict SHA256SUMS
            grep -Fx 'SOURCE_COMMIT=259acccfeefd0523a40f33ff60d33f8131eefe0e' BUILD.txt
            printf '%s\n' \
              '4f14cde0e2ca8b480032f24f4fd5734b0284992a2b3175ff747d3ac94bca3676  Thai-Waters-play.html' \
              'a6323da4983b12797f080bebe8c5eec5c7bc4a855327f7c995cb66ad78e5f270  atlas.wasm' | sha256sum -c --strict
          )
          npm ci --prefix verification/browser-tests
          (
            cd verification/browser-tests
            ./node_modules/.bin/playwright-core install --with-deps chromium
          )
          export NODE_PATH="$PWD/verification/browser-tests/node_modules"
          export BROWSER_PATH="$(node -p 'require("playwright-core").chromium.executablePath()')"
          lab=verification/diagnostics/reload-62
          node --test "$lab/observer.test.cjs"
          python3 "$lab/prepare.py" "$bundle/Thai-Waters-play.html"
          status=0
          node "$lab/bare-storage.cjs" 1 || status=1
          node "$lab/exact-matrix.cjs" 1 || status=1
          exit "$status"
