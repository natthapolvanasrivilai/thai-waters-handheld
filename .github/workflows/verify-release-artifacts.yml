name: Verify release artifacts
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed diagnostic commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: file62-storage-area-f08
  cancel-in-progress: false
jobs:
  storage_area:
    name: Synthetic storage-area witness (not a release)
    if: github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/file62-storage-area-f08' && github.run_attempt == 1 && inputs.source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: f08e82693c259f505d848f91298bd60ae239d662
      DIAG: verification/diagnostics/file62-storage-area
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $SOURCE_SHA"
          test "$(git diff --name-status "$SOURCE_SHA" HEAD)" = "$(printf 'M\t%s\nA\t%s\nA\t%s\n' .github/workflows/verify-release-artifacts.yml "$DIAG/location-map.cjs" "$DIAG/receipt.py")"
          echo "4e54304cfa771fb9bb4c7bec0170b9fe493c510360b4a2a8fda954d64b49e661  $DIAG/location-map.cjs" | sha256sum -c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Rebuild exact game inputs and prepare pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/source" "$SOURCE_SHA"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --max-time 90 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          echo 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  zig.tar.xz' | sha256sum -c
          tar -xf zig.tar.xz
          cd source
          python3 game/build-engine.py --zig "$RUNNER_TEMP/zig-linux-x86_64-0.13.0/zig"
          python3 game/build.py
          sha256sum --check --strict <<'CHECK'
          80b88fca6773b7c348a43e2cb5f1e8ad0478e77ce8790e1de53eb479e946bf2d  game/assets/atlas.wasm
          e7d84c41d04f94b0065f64708f8061a6cacc825d2a7cae5983aad516a2a84cfb  game/assets/landscape.wasm
          0f87d0c63afd86d97602b401967a8c13d75aabfda9a674e6d16a17efc3457f2e  game/Thai-Waters-play.html
          CHECK
          bundle="$RUNNER_TEMP/browser-input"
          mkdir "$bundle"
          cp game/Thai-Waters-play.html game/assets/{atlas,landscape}.wasm "$bundle/"
          printf 'SOURCE_COMMIT=%s\n0.13.0\n' "$SOURCE_SHA" > "$bundle/BUILD.txt"
          (cd "$bundle" && sha256sum Thai-Waters-play.html atlas.wasm landscape.wasm BUILD.txt > SHA256SUMS)
          test "$(node --version)" = v22.16.0
          npm ci --prefix game/lan
          npm ci --prefix verification/browser-tests
          (cd verification/browser-tests && ./node_modules/.bin/playwright-core install --with-deps chromium)
          test "$(node -p 'require("./verification/browser-tests/node_modules/playwright-core/package.json").version')" = 1.62.1
          executable="$(node -p 'require("./verification/browser-tests/node_modules/playwright-core").chromium.executablePath()')"
          test "$("$executable" --version)" = 'Chromium 151.0.7922.34'
      - name: Run canonical Device test order and report allowlisted evidence only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/source"
          cp "$GITHUB_WORKSPACE/$DIAG/location-map.cjs" verification/browser-tests/location-map.cjs
          node --check verification/browser-tests/location-map.cjs
          export BROWSER_PATH="$(node -p 'require("./verification/browser-tests/node_modules/playwright-core").chromium.executablePath()')"
          status=0
          timeout 900 python3 .github/scripts/browser-release-shards.py run --root "$PWD" --shard device \
            --bundle "$RUNNER_TEMP/browser-input" --diagnostics "$RUNNER_TEMP/device-logs" \
            > "$RUNNER_TEMP/device-output.log" 2>&1 || status=$?
          printf 'canonicalDeviceExit=%d\n' "$status"
          python3 "$GITHUB_WORKSPACE/$DIAG/receipt.py" "$RUNNER_TEMP/device-logs/location-map.cjs.log"
          exit "$status"
