name: Verify release artifacts
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed Windows diagnostic branch SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  solo_windows:
    if: github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/solo-windows-f08' && github.run_attempt == 1 && inputs.source_sha == github.sha
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      BASE: f08e82693c259f505d848f91298bd60ae239d662
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Run bounded synthetic Windows diagnostics (HOLD)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $parent = & git rev-list --parents -n1 HEAD
          $previous = 'dea26c684f8f7de70a1f8b66e507a8cff9a3daa1'
          if ($parent -cne "$env:GITHUB_SHA $previous" -or (& git rev-list --parents -n1 $previous) -cne "$previous $env:BASE") { throw 'Wrong base or head' }
          if ((& git diff --name-only $previous HEAD) -cne '.github/workflows/verify-release-artifacts.yml') { throw 'Unexpected successor changes' }
          $diag = 'verification/diagnostics/solo-windows'
          $allow = @("M`t.github/workflows/verify-release-artifacts.yml","A`t$diag/Start-Pocket-Reel-Solo.mjs","A`t$diag/exact-browser-probe.mjs","A`t$diag/exact-http.test.mjs","A`t$diag/exact-pack.mjs")
          if (((& git diff --name-status $env:BASE HEAD) -join "`n") -cne ($allow -join "`n")) { throw 'Unexpected diagnostic source changes' }
          $candidate = Join-Path $env:RUNNER_TEMP 'Pocket Reel ทดสอบ HOLD'
          $src = Join-Path $env:RUNNER_TEMP 'source-f08'
          $tools = Join-Path $env:RUNNER_TEMP 'zig-f08'
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          function RequireHash($path,$digest) {
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant() -cne $digest) { throw ("Pinned checksum mismatch: " + (Split-Path -Leaf $path)) }
          }
          try {
            & git -c core.autocrlf=false worktree add --detach $src $env:BASE
            $manifest = Invoke-RestMethod 'https://ziglang.org/download/index.json'
            $win = $manifest.'0.13.0'.'x86_64-windows'
            $url = 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip'
            $zigHash = 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158'
            if ($win.tarball -cne $url -or $win.shasum -cne $zigHash) { throw 'Official Zig pin changed or unavailable' }
            Invoke-WebRequest -Uri $url -OutFile $archive
            RequireHash $archive $zigHash
            Expand-Archive -LiteralPath $archive -DestinationPath $tools
            $zig = Join-Path $tools 'zig-windows-x86_64-0.13.0/zig.exe'
            if ((& $zig version) -cne '0.13.0') { throw 'Wrong Zig' }
            Push-Location $src
            try {
              & python game/build-engine.py --zig $zig
              & python game/build.py
              # The unchanged Python source writes text with the host newline.
              # Canonical packaging is LF; validate exact historical bytes after normalization.
              & python -c "from pathlib import Path; p=Path('game/Thai-Waters-play.html'); p.write_bytes(p.read_bytes().replace(bytes([13,10]),bytes([10])))"
              RequireHash 'game/assets/atlas.wasm' '80b88fca6773b7c348a43e2cb5f1e8ad0478e77ce8790e1de53eb479e946bf2d'
              RequireHash 'game/assets/landscape.wasm' 'e7d84c41d04f94b0065f64708f8061a6cacc825d2a7cae5983aad516a2a84cfb'
              $htmlSha = '0f87d0c63afd86d97602b401967a8c13d75aabfda9a674e6d16a17efc3457f2e'
              RequireHash 'game/Thai-Waters-play.html' $htmlSha
              & npm ci --prefix verification/browser-tests --ignore-scripts
              $env:NODE_PATH = Join-Path $src 'verification/browser-tests/node_modules'
              if ((& node --version) -cne 'v22.16.0' -or (& node -p 'require("playwright-core/package.json").version') -cne '1.62.1') { throw 'Wrong Node or Playwright' }
              & node verification/browser-tests/node_modules/playwright-core/cli.js install chromium
            } finally { Pop-Location }
            $chrome = & node -p 'require("playwright-core").chromium.executablePath()'
            $version = (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
            if ($version -cne '151.0.7922.34') { throw 'Wrong Chromium' }
            $env:POCKET_REEL_CHROMIUM_PIN = $version
            $env:BROWSER_PATH = $chrome
            $env:POCKET_REEL_DISPOSABLE_RUNNER = '1'
            New-Item -ItemType Directory -Path $candidate | Out-Null
            Copy-Item -LiteralPath (Join-Path $src 'game/Thai-Waters-play.html') -Destination $candidate
            $launchSource = "$diag/Start-Pocket-Reel-Solo.mjs"
            $launcher = Join-Path $candidate 'Start-Pocket-Reel-Solo.mjs'
            $checkoutHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $launchSource).Hash.ToLowerInvariant()
            Write-Output "Launcher checkout SHA-256: $checkoutHash"
            & node -e 'const {execFileSync}=require("node:child_process"); const {writeFileSync}=require("node:fs"); const [spec,out]=process.argv.slice(1); writeFileSync(out,execFileSync("git",["cat-file","blob",spec]),{flag:"wx"});' "HEAD:$launchSource" $launcher
            RequireHash $launcher '0b0791dcb8bcb5c5a049eff2d56b4e535a56e54e20ea1569506d424691006705'
            [IO.File]::WriteAllText((Join-Path $candidate 'Pocket-Reel-HTML.sha256'),"$htmlSha  Thai-Waters-play.html`n")
            [IO.File]::WriteAllText((Join-Path $candidate 'HOLD.txt'),'ENGINEERING HOLD - NOT RELEASE ELIGIBLE')
            $env:POCKET_REEL_HOLD_PACKAGE = $candidate
            & node --test "$diag/exact-http.test.mjs"
            # Run both witnesses independently once after HTTP and identity checks pass.
            # Neither this nor loopback substitutes for the unchanged aggregate.
            $PSNativeCommandUseErrorActionPreference = $false
            try {
              & node "$diag/exact-browser-probe.mjs"
              $loopbackExit = $LASTEXITCODE
              & node (Join-Path $src 'verification/browser-tests/file-career-offline.cjs')
              $directFileExit = $LASTEXITCODE
            } finally {
              $PSNativeCommandUseErrorActionPreference = $true
            }
            Write-Output "Windows synthetic diagnostic: loopback=$loopbackExit direct-file=$directFileExit; publication remains ineligible."
            if ($loopbackExit -ne 0 -or $directFileExit -ne 0) { throw 'A Windows synthetic witness failed' }
          } finally {
            Remove-Item -LiteralPath $candidate -Recurse -Force -ErrorAction SilentlyContinue
          }
