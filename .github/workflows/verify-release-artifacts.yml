# Dedicated diagnostic branch definition only. Never merge into canonical workflow.
name: Verify release artifacts (one-off fixed-origin persistence)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact guard candidate source (198c45b6 only)
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: pocket-reel-80-loopback-persistence-once
  cancel-in-progress: false
jobs:
  exact_loopback_browser_persistence:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.ref == 'refs/heads/diagnostic/reload-80-loopback-persistence' && inputs.source_sha == '198c45b654be887bf3ff6eb56b5dc814db33256e'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '44889590954'
          artifact-ids: '14701657283'
          merge-multiple: true
          path: ${{ runner.temp }}/exact-browser-input
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify exact packed HTML and same-loopback-origin synthetic persistence
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          src=198c45b654be887bf3ff6eb56b5dc814db33256e
          test "$(git rev-list --parents -n 1 HEAD)" = "$(git rev-parse HEAD) $src"
          test "$(git rev-parse 'HEAD^1^{tree}')" = b73b142367f080565160e32b1e5e545da9fb9074
          test "$(node -p process.versions.node)" = 22.16.0
          probe=verification/diagnostics/loopback-persistence
          printf '%s\n' .github/workflows/verify-release-artifacts.yml "$probe/browser-persistence.probe.mjs" "$probe/launcher.mjs" |
            diff - <(git diff --name-only HEAD^1 HEAD)
          printf '%s  %s\n' \
            a267af3ec2b3dcb0fe98064cc772979d802c7e53a0615a788667cb0e70111b8a "$probe/browser-persistence.probe.mjs" \
            88788f843e07e1ca5ba31603950a7f649531e8bc8657ffd0453b19a5913a05c5 "$probe/launcher.mjs" |
            sha256sum -c --strict
          bundle="$RUNNER_TEMP/exact-browser-input"
          (
            cd "$bundle"
            test "$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" = "$(printf '%s\n' BUILD.txt SHA256SUMS Thai-Waters-play.html atlas.wasm)"
            for f in BUILD.txt SHA256SUMS Thai-Waters-play.html atlas.wasm; do test -f "$f" && test ! -L "$f"; done
            printf '%s  %s\n' \
              733ed48979df81f8659bb07bd82a33fa8b5e155b9c5fa53a5f3d21e604949494 BUILD.txt \
              059520231a2af10db42c1673df9aa59698cf6d2c68efcd893de5d7c46fafa99f SHA256SUMS \
              2f9b1663f1ba573869ee6ef84907825b0ca63c8d43efaf9e7a3888b8aba3e425 Thai-Waters-play.html \
              a6323da4983b12797f080bebe8c5eec5c7bc4a855327f7c995cb66ad78e5f270 atlas.wasm |
              sha256sum -c --strict
            sha256sum -c --strict SHA256SUMS
            grep -Fx "SOURCE_COMMIT=$src" BUILD.txt
          )
          w="$(mktemp -d)"
          trap 'rm -rf -- "$w"' EXIT
          # Only original dependency manifests are needed, not repo code or user data.
          git show "$src:verification/browser-tests/package-lock.json" > "$w/package-lock.json"
          git show "$src:verification/browser-tests/package.json" > "$w/package.json"
          test "$(git hash-object "$w/package-lock.json")" = 6d87b4abcf29cce3eb92946db163f9c77343b72d
          test "$(git hash-object "$w/package.json")" = f2c14a9fd1ca178aa3848fd299394516118f57ba
          export PLAYWRIGHT_BROWSERS_PATH="$w/chromium"
          npm ci --ignore-scripts --prefix "$w"
          "$w/node_modules/.bin/playwright-core" install --with-deps chromium
          export NODE_PATH="$w/node_modules"
          # Scripts write only internally-generated synthetic profile data in temp and clean after normal stop.
          POCKET_REEL_AUTHORIZED_TEST_RUNNER=1 timeout 5m node "$probe/browser-persistence.probe.mjs" "$bundle/Thai-Waters-play.html"
