name: Verify release artifacts
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable diagnostic commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  offline_transport:
    if: github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.ref == 'refs/heads/diagnostic/file62-transport-isolated' && inputs.source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify isolated fixture and run on pinned browser
        shell: bash
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-list --parents -n1 HEAD)" = "$DIAGNOSTIC_SHA f08e82693c259f505d848f91298bd60ae239d662"
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' '.github/workflows/verify-release-artifacts.yml' 'verification/diagnostics/file62/pinned-transport.cjs')"
          npm ci --prefix verification/browser-tests
          (cd verification/browser-tests && ./node_modules/.bin/playwright-core install --with-deps chromium)
          node --check verification/diagnostics/file62/pinned-transport.cjs
          node verification/diagnostics/file62/pinned-transport.cjs
