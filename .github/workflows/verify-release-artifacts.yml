# Diagnostic branch copy only. Do not merge to main or accept it as a release gate.
name: Verify release artifacts (one-off #80 Gameplay storage diagnosis only)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact original #80 failing browser artifact source (01db3b50… only)
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: pocket-reel-80-one-pair
  cancel-in-progress: false
jobs:
  gameplay_reload_pair:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.ref == 'refs/heads/diagnostic/reload-80-gameplay-pair-once' && inputs.source_sha == '01db3b50b4b73dd7e0eee9cc566efe7a105ddc6e'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECT_BROWSER_VERSION: '151.0.7922.34'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '44878633316'
          artifact-ids: '14696923322'
          merge-multiple: true
          path: ${{ runner.temp }}/exact-browser-input
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify immutable source and run exactly one full Gameplay pair
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          test "$(git rev-list --parents -n 1 HEAD)" = "$(git rev-parse HEAD) 01db3b50b4b73dd7e0eee9cc566efe7a105ddc6e"
          test "$(git rev-parse 'HEAD^1^{tree}')" = ff13aea4d82d228a0102313b31a1858dbc994a13
          printf '%s\n' \
            '.github/workflows/verify-release-artifacts.yml' \
            'verification/diagnostics/reload-80/diagnostic-only.diff' \
            'verification/diagnostics/reload-80/run-paired.cjs' \
            'verification/diagnostics/reload-80/verify-local.cjs' \
            | diff - <(git diff --name-only HEAD^1 HEAD)
          base=verification/browser-tests
          test "$(git hash-object "$base/gameplay.cjs")" = 2e861c49fca580e58f7523de595fe1735df1f1dd
          test "$(git hash-object "$base/reload-trace.cjs")" = 1c5680d6f4c7503b902bb4c1ef94f62a092852c0
          test "$(git hash-object "$base/menu-controls.cjs")" = fe598a28ce472860fdb96380d104c40b54b36095
          test "$(git hash-object "$base/package-lock.json")" = 6d87b4abcf29cce3eb92946db163f9c77343b72d
          test "$(git hash-object "$base/package.json")" = f2c14a9fd1ca178aa3848fd299394516118f57ba
          diag="$PWD/verification/diagnostics/reload-80"
          bundle="$RUNNER_TEMP/exact-browser-input"
          (
            cd "$bundle"
            sha256sum -c --strict SHA256SUMS
            grep -Fx 'SOURCE_COMMIT=01db3b50b4b73dd7e0eee9cc566efe7a105ddc6e' BUILD.txt
            printf '%s\n' \
              '1874a1cdc822eff6f2012e27355f56808a66411f101d0dd8beca42e723b6f02e  Thai-Waters-play.html' \
              'a6323da4983b12797f080bebe8c5eec5c7bc4a855327f7c995cb66ad78e5f270  atlas.wasm' \
              | sha256sum -c --strict
          )
          lab="$RUNNER_TEMP/gameplay-pair"
          mkdir -p "$lab/artifact" "$lab/base/$base" "$lab/work/$base"
          cp -- "$bundle"/{Thai-Waters-play.html,atlas.wasm,BUILD.txt} "$lab/artifact/"
          cp -- "$base"/{gameplay,reload-trace,menu-controls}.cjs "$lab/base/$base/"
          cp -- "$lab/base/$base/"*.cjs "$lab/work/$base/"
          cp -- "$diag"/{run-paired,verify-local}.cjs "$lab/"
          (
            cd "$lab/work"
            git apply --check "$diag/diagnostic-only.diff"
            git apply "$diag/diagnostic-only.diff"
          )
          node --test "$lab/verify-local.cjs"
          npm ci --ignore-scripts --prefix "$base"
          "$base/node_modules/.bin/playwright-core" install --with-deps chromium
          export NODE_PATH="$PWD/$base/node_modules"
          export BROWSER_PATH="$(node -p 'require("playwright-core").chromium.executablePath()')"
          node "$lab/run-paired.cjs"
