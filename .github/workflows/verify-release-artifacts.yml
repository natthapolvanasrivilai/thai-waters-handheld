# Diagnostic branch only. This is supplemental evidence, never a release gate.
name: Verify release artifacts (one-off known file-save safeguard only)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact guard candidate source (198c45b6 only)
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: pocket-reel-80-known-file-save-once
  cancel-in-progress: false
jobs:
  proof_known_file_save_guard:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.ref == 'refs/heads/diagnostic/reload-80-known-save-ui' && inputs.source_sha == '198c45b654be887bf3ff6eb56b5dc814db33256e'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '44889590954'
          artifact-ids: '14701657283'
          merge-multiple: true
          path: ${{ runner.temp }}/exact-browser-input
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify exact candidate and prove one offline safeguard scenario
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          test "$(git rev-list --parents -n 1 HEAD)" = "$(git rev-parse HEAD) 198c45b654be887bf3ff6eb56b5dc814db33256e"
          test "$(git rev-parse 'HEAD^1^{tree}')" = b73b142367f080565160e32b1e5e545da9fb9074
          probe="verification/diagnostics/file-career-offline.cjs"
          printf '%s\n' '.github/workflows/verify-release-artifacts.yml' "$probe" | diff - <(git diff --name-only HEAD^1 HEAD)
          printf '%s  %s\n' 'f82ad703c940dbcabd8bc760f22ab8813b6540a08e4fd8b5ffd9751fd1354543' "$probe" | sha256sum -c --strict
          base="verification/browser-tests"
          test "$(git hash-object "$base/menu-controls.cjs")" = fe598a28ce472860fdb96380d104c40b54b36095
          test "$(git hash-object "$base/package-lock.json")" = 6d87b4abcf29cce3eb92946db163f9c77343b72d
          test "$(git hash-object "$base/package.json")" = f2c14a9fd1ca178aa3848fd299394516118f57ba
          bundle="$RUNNER_TEMP/exact-browser-input"
          (
            cd "$bundle"
            sha256sum -c --strict SHA256SUMS
            grep -Fx 'SOURCE_COMMIT=198c45b654be887bf3ff6eb56b5dc814db33256e' BUILD.txt
            printf '%s\n' \
              '2f9b1663f1ba573869ee6ef84907825b0ca63c8d43efaf9e7a3888b8aba3e425  Thai-Waters-play.html' \
              'a6323da4983b12797f080bebe8c5eec5c7bc4a855327f7c995cb66ad78e5f270  atlas.wasm' \
              | sha256sum -c --strict
          )
          npm ci --ignore-scripts --prefix "$base"
          "$base/node_modules/.bin/playwright-core" install --with-deps chromium
          export NODE_PATH="$PWD/$base/node_modules"
          export BROWSER_PATH="$(node -p 'require("playwright-core").chromium.executablePath()')"
          "$BROWSER_PATH" --version | grep -F '151.0.7922.34'
          timeout 5m node "$probe" "$bundle/Thai-Waters-play.html"
