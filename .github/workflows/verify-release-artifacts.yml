name: Verify release artifacts
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed diagnostic branch SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: file62-isolation-f08
  cancel-in-progress: false
jobs:
  file62:
    name: Disposable file storage diagnostic (no release)
    if: github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/file62-f08' && github.run_attempt == 1 && inputs.source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: f08e82693c259f505d848f91298bd60ae239d662
      DIAG: verification/diagnostics/file62
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one reviewed child of exact main and minimal scope
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $BASE"
          test "$(git diff --name-status "$BASE" HEAD)" = "$(printf 'M\t%s\nA\t%s\nA\t%s\nA\t%s\nA\t%s\n' .github/workflows/verify-release-artifacts.yml "$DIAG/diagnostic.patch" "$DIAG/file-storage-fixture.cjs" "$DIAG/file-storage-fixture.html" "$DIAG/run-private-experiment.sh")"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Reconstruct the exact previously verified browser inputs
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/source" "$BASE"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --max-time 90 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          echo 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  zig.tar.xz' | sha256sum -c
          tar -xf zig.tar.xz
          cd source
          python3 game/build-engine.py --zig "$RUNNER_TEMP/zig-linux-x86_64-0.13.0/zig"
          python3 game/build.py
          sha256sum --check --strict <<'CHECK'
          80b88fca6773b7c348a43e2cb5f1e8ad0478e77ce8790e1de53eb479e946bf2d  game/assets/atlas.wasm
          e7d84c41d04f94b0065f64708f8061a6cacc825d2a7cae5983aad516a2a84cfb  game/assets/landscape.wasm
          0f87d0c63afd86d97602b401967a8c13d75aabfda9a674e6d16a17efc3457f2e  game/Thai-Waters-play.html
          CHECK
          npm ci --prefix verification/browser-tests --ignore-scripts
          (cd verification/browser-tests && ./node_modules/.bin/playwright-core install --with-deps chromium)
      - name: Run the synthetic fixture and actual direct-file map check independently
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/results"
          mkdir "$stage"
          code=0
          bash "$DIAG/run-private-experiment.sh" "$RUNNER_TEMP/source" "$RUNNER_TEMP/source/game/Thai-Waters-play.html" "$stage" || code=$?
          cat "$stage/inputs.txt" "$stage/exit-status.txt"
          grep -E '^(Synthetic file control|\{"cycle":)' "$stage/fixture.log" || true
          python3 - "$stage/app.log" <<'PYCODE'
          import json, sys
          from pathlib import Path
          for line in Path(sys.argv[1]).read_text().splitlines():
              if line.startswith("TW_LANE file "):
                  print(line)
              if not line.startswith("Map standalone reload "):
                  continue
              data=json.loads(line.removeprefix("Map standalone reload "))
              out={k:data[k] for k in ("lane","sameFile","lock","powered","recovery")}
              out["startupFailed"]=data.get("startupError") is not None
              for stage in ("beforeReload","atStart","afterBoot"):
                  state=data.get(stage) or {}
                  out[stage]={k:state.get(k) for k in ("known","present","languageBinding","ready")}
              print(json.dumps(out,sort_keys=True))
          PYCODE
          exit "$code"
