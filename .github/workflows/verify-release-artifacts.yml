name: Verify release artifacts
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed Windows diagnostic branch SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  solo_windows:
    if: github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/solo-packaged-windows-f08' && github.run_attempt == 1 && inputs.source_sha == github.sha
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      BASE: f08e82693c259f505d848f91298bd60ae239d662
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Run bounded synthetic Windows diagnostics (HOLD)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $parent = & git rev-list --parents -n1 HEAD
          if ($parent -cne "$env:GITHUB_SHA $env:BASE") { throw 'Wrong base or head' }
          $diag = 'verification/diagnostics/solo-windows-package'
          $pack = 'verification/solo'
          $allow = @("M`t.github/workflows/verify-release-artifacts.yml","A`t$diag/exact-browser-probe.mjs","A`t$diag/exact-http.test.mjs","A`t$diag/exact-pack.mjs","A`t$diag/rebuild-browser-input.py","A`t$pack/.gitattributes","A`t$pack/README.txt","A`t$pack/Start-Pocket-Reel-Solo.mjs","A`t$pack/pack.py","A`t$pack/test_pack.py")
          if (((& git diff --name-status $env:BASE HEAD) -join "`n") -cne ($allow -join "`n")) { throw 'Unexpected diagnostic source changes' }
          $candidate = Join-Path $env:RUNNER_TEMP 'Pocket Reel ทดสอบ HOLD'
          $src = Join-Path $env:RUNNER_TEMP 'source-f08'
          $tools = Join-Path $env:RUNNER_TEMP 'zig-f08'
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          function RequireHash($path,$digest) {
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant() -cne $digest) { throw 'Pinned checksum mismatch' }
          }
          try {
            & git -c core.autocrlf=false worktree add --detach $src $env:BASE
            $manifest = Invoke-RestMethod 'https://ziglang.org/download/index.json'
            $win = $manifest.'0.13.0'.'x86_64-windows'
            $url = 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip'
            $zigHash = 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158'
            if ($win.tarball -cne $url -or $win.shasum -cne $zigHash) { throw 'Official Zig pin changed or unavailable' }
            Invoke-WebRequest -Uri $url -OutFile $archive
            RequireHash $archive $zigHash
            Expand-Archive -LiteralPath $archive -DestinationPath $tools
            $zig = Join-Path $tools 'zig-windows-x86_64-0.13.0/zig.exe'
            if ((& $zig version) -cne '0.13.0') { throw 'Wrong Zig' }
            Push-Location $src
            try {
              & python game/build-engine.py --zig $zig
              & python game/build.py
              # The unchanged Python source writes text with the host newline.
              # Canonical packaging is LF; validate exact historical bytes after normalization.
              & python -c "from pathlib import Path; p=Path('game/Thai-Waters-play.html'); p.write_bytes(p.read_bytes().replace(bytes([13,10]),bytes([10])))"
              RequireHash 'game/assets/atlas.wasm' '80b88fca6773b7c348a43e2cb5f1e8ad0478e77ce8790e1de53eb479e946bf2d'
              RequireHash 'game/assets/landscape.wasm' 'e7d84c41d04f94b0065f64708f8061a6cacc825d2a7cae5983aad516a2a84cfb'
              $htmlSha = '0f87d0c63afd86d97602b401967a8c13d75aabfda9a674e6d16a17efc3457f2e'
              RequireHash 'game/Thai-Waters-play.html' $htmlSha
              & npm ci --prefix verification/browser-tests --ignore-scripts
              $env:NODE_PATH = Join-Path $src 'verification/browser-tests/node_modules'
              if ((& node --version) -cne 'v22.16.0' -or (& node -p 'require("playwright-core/package.json").version') -cne '1.62.1') { throw 'Wrong Node or Playwright' }
              & node verification/browser-tests/node_modules/playwright-core/cli.js install chromium
            } finally { Pop-Location }
            $chrome = & node -p 'require("playwright-core").chromium.executablePath()'
            $version = (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
            if ($version -cne '151.0.7922.34') { throw 'Wrong Chromium' }
            $env:POCKET_REEL_CHROMIUM_PIN = $version
            $env:BROWSER_PATH = $chrome
            $env:POCKET_REEL_DISPOSABLE_RUNNER = '1'
            $inputZip = Join-Path $env:RUNNER_TEMP 'browser-exact-input.zip'
            $soloZip = Join-Path $env:RUNNER_TEMP 'solo-exact-hold.zip'
            $inputSha = 'c875933cba45f853b913654cfd6d4be536ca546635436044dcc48630f6065f4d'
            $soloSha = 'c55b13d1a619e287e8f2e9c8af1d5b661f9695edc3946500033bc56777f34485'
            & python -B "$diag/rebuild-browser-input.py" $inputZip $src
            RequireHash $inputZip $inputSha
            & python -B -m unittest discover -s $pack -v
            & python -B "$pack/pack.py" build --browser $inputZip --browser-sha256 $inputSha --source $env:BASE --output $soloZip
            RequireHash $soloZip $soloSha
            & python -B "$pack/pack.py" verify --browser $inputZip --browser-sha256 $inputSha --source $env:BASE --output $soloZip
            Expand-Archive -LiteralPath $soloZip -DestinationPath $candidate
            if ((Get-ChildItem -LiteralPath $candidate | Measure-Object).Count -ne 4) { throw 'Wrong extracted package inventory' }
            RequireHash (Join-Path $candidate 'README.txt') 'b4478e0fb93100d4a812094cab52602697bb88d4fdcfdafb016cfe092f76598c'
            [IO.File]::WriteAllText((Join-Path $candidate 'HOLD.txt'),'ENGINEERING HOLD - NOT RELEASE ELIGIBLE')
            $env:POCKET_REEL_HOLD_PACKAGE = $candidate
            & node --test "$diag/exact-http.test.mjs"
            & node "$diag/exact-browser-probe.mjs"
            # Additional direct-file witness; neither this nor loopback substitutes for the unchanged aggregate.
            & node (Join-Path $src 'verification/browser-tests/file-career-offline.cjs')
            Write-Output 'Windows synthetic diagnostic only; publication remains ineligible.'
          } finally {
            Remove-Item -LiteralPath $candidate -Recurse -Force -ErrorAction SilentlyContinue
          }
