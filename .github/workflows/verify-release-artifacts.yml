# Dedicated diagnostic branch definition only. Never merge into canonical workflow.
name: Verify release artifacts (one-off World storage boundary)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact World failing source (198c45b6 only)
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: pocket-reel-80-world-boundaries-once
  cancel-in-progress: false
jobs:
  exact_world_storage_boundary:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'natthapolvanasrivilai/thai-waters-handheld' && github.ref == 'refs/heads/diagnostic/reload-80-world-boundaries' && inputs.source_sha == '198c45b654be887bf3ff6eb56b5dc814db33256e'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '44889590954'
          artifact-ids: '14701657283'
          merge-multiple: true
          path: ${{ runner.temp }}/exact-browser-input
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify artifact and independently retain both World fixture outcomes
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          src=198c45b654be887bf3ff6eb56b5dc814db33256e
          test "$(git rev-list --parents -n 1 HEAD)" = "$(git rev-parse HEAD) $src"
          test "$(git rev-parse 'HEAD^1^{tree}')" = b73b142367f080565160e32b1e5e545da9fb9074
          test "$(node -p process.versions.node)" = 22.16.0
          probe=verification/diagnostics/world-boundaries
          printf '%s\n' .github/workflows/verify-release-artifacts.yml "$probe/landing-audio.cjs" "$probe/specimen-art.cjs" "$probe/world-reload-observer.cjs" |
            diff - <(git diff --name-only HEAD^1 HEAD)
          printf '%s  %s\n' \
            6b201bab6fd88013e83e792774f44f8ec8b11e4a38873d89eb96d038c88006ee "$probe/landing-audio.cjs" \
            d69568b5d4d402f90e5a3556113fe58ab847beb0d5f147373975b2727bf7c3fd "$probe/specimen-art.cjs" \
            afc1311132336d2c47d2e4c73f3642b80c4f182ed65acb7b76d26da93305174c "$probe/world-reload-observer.cjs" |
            sha256sum -c --strict
          bundle="$RUNNER_TEMP/exact-browser-input"
          (
            cd "$bundle"
            test "$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" = "$(printf '%s\n' BUILD.txt SHA256SUMS Thai-Waters-play.html atlas.wasm)"
            for f in BUILD.txt SHA256SUMS Thai-Waters-play.html atlas.wasm; do test -f "$f" && test ! -L "$f"; done
            printf '%s  %s\n' \
              733ed48979df81f8659bb07bd82a33fa8b5e155b9c5fa53a5f3d21e604949494 BUILD.txt \
              059520231a2af10db42c1673df9aa59698cf6d2c68efcd893de5d7c46fafa99f SHA256SUMS \
              2f9b1663f1ba573869ee6ef84907825b0ca63c8d43efaf9e7a3888b8aba3e425 Thai-Waters-play.html \
              a6323da4983b12797f080bebe8c5eec5c7bc4a855327f7c995cb66ad78e5f270 atlas.wasm |
              sha256sum -c --strict
            sha256sum -c --strict SHA256SUMS
            grep -Fx "SOURCE_COMMIT=$src" BUILD.txt
          )
          w="$(mktemp -d)"
          trap 'rm -rf -- "$w"' EXIT
          srcdir="$w/source"
          mkdir "$srcdir"
          git archive "$src" verification/browser-tests game/art-source/field/plates.json | tar -x -C "$srcdir"
          base="$srcdir/verification/browser-tests"
          test "$(git hash-object "$base/landing-audio.cjs")" = b65ce4f6ebe1a297d6a86ba1931f19dba21d7b83
          test "$(git hash-object "$base/specimen-art.cjs")" = 5bd9b107637dcc89c933494953973b60bd8495b7
          test "$(git hash-object "$base/reload-trace.cjs")" = 1c5680d6f4c7503b902bb4c1ef94f62a092852c0
          test "$(git hash-object "$base/package-lock.json")" = 6d87b4abcf29cce3eb92946db163f9c77343b72d
          test "$(git hash-object "$base/package.json")" = f2c14a9fd1ca178aa3848fd299394516118f57ba
          test "$(git hash-object "$srcdir/game/art-source/field/plates.json")" = 9241b41a655d42173c3bd45c2c38d56bdafca18c
          cp -- "$bundle/Thai-Waters-play.html" "$srcdir/game/Thai-Waters-play.html"
          cp -- "$probe/"{landing-audio,specimen-art,world-reload-observer}.cjs "$base/"
          npm ci --ignore-scripts --prefix "$base"
          "$base/node_modules/.bin/playwright-core" install --with-deps chromium
          export NODE_PATH="$base/node_modules"
          export BROWSER_PATH="$(node -p 'require("playwright-core").chromium.executablePath()')"
          "$BROWSER_PATH" --version | grep -F '151.0.7922.34'
          unset LABEO_PREVIEW ART_PREVIEW
          l=0; s=0
          timeout 5m node "$base/landing-audio.cjs" || l=$?
          timeout 5m node "$base/specimen-art.cjs" || s=$?
          printf 'Independent fixture exit codes: landing-audio=%s specimen-art=%s\n' "$l" "$s"
          (( l == 0 && s == 0 ))
