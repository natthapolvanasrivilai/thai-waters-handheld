name: Validate repository skills
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/validate_repo_skills.py .
      - run: python3 -B -m unittest discover -s tools/tests -p test_validate_repo_skills.py
      - run: python3 -B -m unittest discover -s tools/tests -p test_verify_model_extrusion.py
