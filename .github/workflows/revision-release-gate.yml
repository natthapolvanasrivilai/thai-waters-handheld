name: Revision release gate
on:
  pull_request:
    paths:
      - '.github/workflows/revision-release-gate.yml'
      - 'tools/*revision_gate*'
      - 'tools/release_handbook.py'
      - 'tools/release_tag_probe.py'
      - '.github/scripts/*nightly*'
      - '.github/workflows/verify-release-artifacts.yml'
      - 'quality/revision-gates/**'
  push:
    branches: [policy/revision-release-constitution]
  workflow_dispatch:
    inputs:
      phase:
        description: Validate before tag creation or before draft publication
        required: true
        type: choice
        options: [pre-tag, pre-publish]
        default: pre-tag
      intended_tag:
        description: Exact intended tag name in the evidence manifest
        required: true
        type: string
      intended_source:
        description: Exact full source SHA intended for this tag
        required: true
        type: string
      evidence_sha:
        description: Exact 40-character SHA containing the completed revision manifest
        required: true
        type: string
      manifest:
        description: Tracked path under quality/revision-gates/
        required: true
        type: string
      release_id:
        description: GitHub ID of the draft release that already contains the offline handbook asset
        required: false
        type: string
      handbook_asset:
        description: Exact staged handbook HTML filename
        required: false
        type: string
      review_pr:
        description: PR number for production (blank for prototype)
        required: false
        type: string
permissions:
  contents: read
jobs:
  policy_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools -p test_revision_gate.py -v
      - run: python3 .github/scripts/test_nightly_release.py
  check_revision:
    if: github.event_name == 'workflow_dispatch'
    needs: policy_tests
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require trusted default workflow and exact evidence SHA
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVIDENCE_SHA: ${{ inputs.evidence_sha }}
        run: |
          set -euo pipefail
          test "$REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$EVIDENCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: policy
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          path: evidence
          ref: ${{ inputs.evidence_sha }}
      - name: Read repository and current review facts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.review_pr }}
          EVIDENCE_SHA: ${{ inputs.evidence_sha }}
          PHASE: ${{ inputs.phase }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          HANDBOOK_ASSET: ${{ inputs.handbook_asset }}
        run: |
          set -euo pipefail
          base="repos/$GITHUB_REPOSITORY"
          gh api "$base" --jq '.private' > "$RUNNER_TEMP/private.json"
          echo '[]' > "$RUNNER_TEMP/reviews.json"
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            test "$(gh api "$base/pulls/$PR_NUMBER" --jq '.head.sha')" = "$EVIDENCE_SHA"
            gh api --paginate --slurp "$base/pulls/$PR_NUMBER/reviews?per_page=100" --jq 'add' > "$RUNNER_TEMP/reviews.json"
          fi
          if [[ "$PHASE" == pre-tag ]]; then
            test -z "$RELEASE_ID" && test -z "$HANDBOOK_ASSET"
            python3 policy/tools/release_tag_probe.py "$GITHUB_REPOSITORY" "$INTENDED_TAG" \
              > "$RUNNER_TEMP/tag-probe.json"
            jq -n --slurpfile p "$RUNNER_TEMP/private.json" --slurpfile r "$RUNNER_TEMP/reviews.json" \
              --slurpfile t "$RUNNER_TEMP/tag-probe.json" \
              '{private: $p[0], reviews: $r[0], tag_probe: $t[0]}' > "$RUNNER_TEMP/github-facts.json"
            exit 0
          fi
          [[ "$PHASE" == pre-publish ]]
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HANDBOOK_ASSET" =~ ^Pocket-Reel-Handbook-[A-Za-z0-9._-]+\.html$ ]]
          release="$(gh api "$base/releases/$RELEASE_ID")"
          tag="$(jq -er 'select(.draft == true) | .tag_name' <<< "$release")"
          test "$tag" = "$INTENDED_TAG"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
          obj="$(gh api "$base/git/ref/tags/$tag" --jq '.object')"
          for _ in {1..8}; do
            kind="$(jq -er '.type' <<< "$obj")"
            sha="$(jq -er '.sha' <<< "$obj")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$kind" == commit ]]; then break; fi
            [[ "$kind" == tag ]]
            obj="$(gh api "$base/git/tags/$sha" --jq '.object')"
          done
          [[ "$kind" == commit ]]
          asset_id="$(jq -er --arg name "$HANDBOOK_ASSET" '[.assets[] |
            select(.name == $name and .state == "uploaded")] |
            if length == 1 then .[0].id else error("Missing/duplicate uploaded handbook") end' <<< "$release")"
          gh api "$base/releases/assets/$asset_id" -H 'Accept: application/octet-stream' \
            > "$RUNNER_TEMP/handbook-release-asset.html"
          digest="$(sha256sum "$RUNNER_TEMP/handbook-release-asset.html" | cut -d ' ' -f 1)"
          jq --arg sha "$sha" --arg name "$HANDBOOK_ASSET" --arg digest "$digest" \
            '{tag_name, draft, prerelease, tag_commit:$sha, name:$name, sha256:$digest}' \
            <<< "$release" > "$RUNNER_TEMP/asset.json"
          jq -n --slurpfile p "$RUNNER_TEMP/private.json" --slurpfile r "$RUNNER_TEMP/reviews.json" \
            --slurpfile a "$RUNNER_TEMP/asset.json" \
            '{private: $p[0], reviews: $r[0], release_asset: $a[0]}' > "$RUNNER_TEMP/github-facts.json"
      - name: Check revision evidence (does not release or order)
        env:
          EVIDENCE_SHA: ${{ inputs.evidence_sha }}
          MANIFEST: ${{ inputs.manifest }}
          PHASE: ${{ inputs.phase }}
          INTENDED_SOURCE: ${{ inputs.intended_source }}
          INTENDED_TAG: ${{ inputs.intended_tag }}
        run: |
          python3 policy/tools/revision_gate.py evidence "$MANIFEST" "$EVIDENCE_SHA" \
            --github-facts "$RUNNER_TEMP/github-facts.json" --phase "$PHASE" \
            --intended-tag "$INTENDED_TAG" --intended-source "$INTENDED_SOURCE"
