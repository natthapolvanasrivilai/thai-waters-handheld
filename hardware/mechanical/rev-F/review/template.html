<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thai Waters · Assembly inspection</title>
<style>
@font-face{font-family:Atkinson;src:url(data:font/ttf;base64,@@FONT@@) format('truetype');font-weight:200 800}
:root{font-family:Atkinson,Arial,sans-serif;color:#203630;background:#f3f4ec;--green:#254a40;--cream:#f8f7f0;--line:#c4ccc0;--ink:#233e34;--gold:#8b5a29}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{border:1px solid #a9b8aa;border-radius:6px;background:#fafaf4;color:var(--ink);padding:.45em .7em;cursor:pointer}button:hover{background:#e5eade}button[aria-pressed=true]{background:#234b40;color:#fff5df;border-color:#234b40}button:disabled{opacity:.45;pointer-events:none}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #c69555;outline-offset:2px}header{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(14px,3vw,44px);border-bottom:1px solid var(--line);background:var(--cream)}.title{display:flex;align-items:center;gap:13px}.mark{width:35px;height:35px;border-radius:8px;display:grid;place-items:center;color:#ffe5b4;background:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:clamp(18px,2.8vw,28px);font-weight:640;letter-spacing:-.025em}.rev{font-size:14px;color:#597063}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);min-height:calc(100dvh - 65px)}.canvasbox{display:flex;flex-direction:column;min-width:0}.tabs{padding:12px clamp(12px,2vw,28px);display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tabs button{background:transparent;font-size:14px}.tabs button[aria-pressed=true]{background:var(--green)}#stage{position:relative;flex:1;min-height:420px;background:radial-gradient(ellipse at 50% 40%,#fbfaf3,#e3e7d9)}#stage canvas{width:100%;height:100%;position:absolute;inset:0;touch-action:none}.legend{position:absolute;bottom:9px;left:12px;padding:4px 8px;background:#f9faf0df;border-radius:4px;font-size:12px;color:#475e50;pointer-events:none}.hud{position:absolute;right:12px;top:10px;display:flex;gap:4px;z-index:2}.hud button{background:#f8f9f0e8;min-width:32px;font-size:14px}.control{padding:13px clamp(12px,2vw,28px);border-top:1px solid var(--line);background:var(--cream);display:grid;grid-template-columns:auto minmax(90px,1fr) auto;align-items:center;gap:12px}.control label{font-weight:630}.control output{min-width:44px;font-variant-numeric:tabular-nums;text-align:right}input[type=range]{accent-color:#285344;width:100%}.control .seq{display:flex;align-items:center;justify-content:space-between;grid-column:1/-1;gap:8px;color:#354f43}.seq button{padding:4px 10px}.seq small{color:#576e5d}aside{padding:17px 18px 18px;border-left:1px solid #b6c3b4;background:#faf9f2;display:flex;flex-direction:column;gap:15px;min-width:0}h2{font-size:19px;letter-spacing:-.02em}h3{font-size:15px}.divider{border-bottom:1px solid #d0d8ca;padding-bottom:13px}.optline{font-size:14px;display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:7px}.optline label{display:flex;gap:5px;align-items:center}.optline input{accent-color:#24533f;margin:0}#selected{font-size:18px;font-weight:660}#details{font-size:13px;color:#4d6056;line-height:1.36;margin:5px 0}.identity{display:flex;gap:6px;align-items:center;margin-top:5px}.tag{font-size:11px;line-height:1.4;background:#e2eade;padding:1px 5px;border-radius:3px}.row{display:flex;gap:7px;margin-top:7px}#find{width:100%;border:1px solid #aebbad;border-radius:6px;padding:6px 9px;background:#fffef8}.sub{color:#5d6e62;font-size:12px}.filters{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin:5px 0}#group{min-width:0}.parts{max-height:23vh;min-height:95px;overflow-y:auto;border:1px solid #c5cebf;border-radius:5px}.part{display:grid;grid-template-columns:8px minmax(0,1fr) auto;width:100%;gap:8px;align-items:center;border:0;border-bottom:1px solid #e2e6d9;border-radius:0;background:transparent;text-align:left;font-size:13px}.part:last-child{border:0}.part i{background:var(--sw);width:8px;height:8px;border-radius:50%}.part small{font-size:11px;color:#748575}.part[aria-pressed=true] small{color:#b9cdba}#load{position:absolute;left:14px;top:12px;font-size:14px}.info{display:grid;gap:5px}#sectionRange{max-width:120px}#fallback{font-size:14px;padding:35px;position:absolute;top:15%}.seqdetail{grid-column:1/-1;color:#496152;font-size:13px}.spacer{flex:1}#scope{font-size:12px;line-height:1.35}details summary{cursor:pointer;font-weight:600}details p{margin:6px 0}.alert{border-left:3px solid #bd8548;padding-left:7px;color:#805022}.status-line{font-size:12px;color:#5d6e62;margin:6px 0 0}button.selected{background:var(--green);color:#fff9ed}
@media(max-width:800px){.layout{grid-template-columns:minmax(0,1fr);min-height:0}#stage{min-height:53dvh}aside{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;align-items:start}.parts{max-height:190px}.optline{font-size:13px}}
@media(max-width:500px){header{padding:9px 11px}.title{gap:8px}.mark{width:28px;height:28px}.tabs{gap:3px;padding:8px}.tabs button{font-size:12px;padding:5px 7px}aside{display:flex}.control{padding:8px}.rev{font-size:12px}#stage{min-height:47dvh}.parts{max-height:140px}}
</style></head><body><header><div class="title"><div class="mark" aria-hidden="true"><svg viewBox="0 0 28 28" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.3"><path d="m3 11 11-6 11 6-11 6zM3 15l11 6 11-6M3 19l11 6 11-6"/></svg></div><h1>Thai Waters · Assembly inspection</h1></div><span class="rev">REV F</span></header>
<main class="layout"><div class="canvasbox"><nav class="tabs" aria-label="View"><button data-view="assembled">Assembled</button><button data-view="exploded">Exploded</button><button data-view="interior">Interior</button><button data-view="wiring">Harness</button><button data-view="grip">Slide lock</button></nav><div id="stage"><div class="hud"><button id="fit" title="Fit visible parts">Fit</button><button id="front" title="Front orthographic view">Front</button><button id="rear" title="Rear orthographic view">Rear</button></div><span id="load">Loading CAD…</span><span id="tip" class="legend">Drag to orbit · pinch or scroll to zoom · tap a part to inspect</span><noscript>Enable JavaScript to inspect the 3D assembly.</noscript></div><div class="control"><label for="explode">Explode</label><input id="explode" type="range" min="0" max="100" value="56"><output id="percent" for="explode"></output><div class="seq"><button id="prev" aria-label="Previous assembly stage">←</button><b id="stepTitle"></b><button id="next" aria-label="Next assembly stage">→</button></div><p id="stepNote" class="seqdetail"></p></div></div>
<aside><section class="divider"><h2>Build options</h2><div class="optline"><label><input id="haptic" type="checkbox" checked>Haptics</label><label><input id="rod" type="checkbox" checked>Rod handle</label><label><input id="usb" type="checkbox">USB gauge</label></div><div class="optline"><label>Cell <select id="cell"><option value="catalog">Catalog envelope</option><option value="alt">Supplier STEP</option><option value="drawing">Drawing maximum</option></select></label></div><div class="optline"><label><input id="section" type="checkbox">Section X</label><input id="sectionRange" type="range" min="-50" max="59" value="8" aria-label="Section plane in mm" disabled></div></section>
<section class="divider"><h2 id="selected">Assembly</h2><div class="identity"><span id="ref" class="tag"></span><span id="basis" class="tag"></span></div><p id="details"></p><p class="sub" id="measure"></p><div class="row"><button id="isolate">Isolate part</button><button id="clear">Show assembly</button></div></section>
<section><h2>Part register</h2><div class="filters"><select id="group" aria-label="Filter parts by group"><option>All groups</option></select><button id="groupOnly" title="Show only the selected group">Isolate</button></div><input id="find" type="search" aria-label="Find part or BOM reference" placeholder="Find part or BOM reference"><div id="list" class="parts"></div><p id="listed" class="status-line"></p></section>
<details id="scope"><summary>Fit evidence</summary><p id="evidence"></p><p class="alert" id="cellResult"></p><p>Explosion distances and the section plane are inspection aids. Assembly order and tolerances require a populated trial build.</p></details></aside></main>
<script type="application/json" id="geometry">@@MESH@@</script><script type="application/json" id="checks">@@CHECKS@@</script><script>@@VIEW@@</script></body></html>
