<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCB assembly · Thai Waters R0013</title>
<style>
:root{color-scheme:light;font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:#17362f;background:#f8f6ed;--ink:#17362f;--border:#c5cec0;--label:#5c695f;--paper:#fffcf4}
*{box-sizing:border-box}body{margin:0}main{max-width:1380px;margin:auto;padding:clamp(10px,1.7vw,24px)}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:12px}h1,h2,p{margin:0}h1{font-size:clamp(20px,2.5vw,32px);letter-spacing:-.035em;line-height:1.1}h2{font-size:clamp(21px,2.4vw,30px);letter-spacing:-.035em;line-height:1.13;margin:5px 0 13px}.rev{color:#465e51;font-size:13px;font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1.95fr) minmax(275px,1fr);border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--paper)}
.scene{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border)}.viewport{position:relative;flex:auto;min-height:335px;height:clamp(340px,55vh,600px);background:radial-gradient(ellipse at 50% 35%,#f4f4e9,#dce4d8);overflow:hidden;isolation:isolate}
canvas{display:block;width:100%;height:100%;touch-action:none;outline-offset:-3px}.tag{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;background:#273d32;color:white;font:600 12px/1.3 "Segoe UI",sans-serif;border:1px solid #fff9;padding:3px 7px;border-radius:4px;box-shadow:0 1px 4px #22392c24}.tag[hidden]{display:none}
.legend{display:flex;gap:8px;align-items:center;position:absolute;bottom:10px;left:10px;background:#fffff2e6;color:#39483c;border-radius:4px;padding:3px 8px;pointer-events:none;font-size:12px}.dot{background:#ef9c39;width:10px;height:10px;border:1px solid #976328;border-radius:50%}
.sceneTools,.slideRow,.nav,.partActions,.statusHeading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sceneTools,.slideRow{padding:8px 13px;border-top:1px solid var(--border)}.slideRow{gap:10px}.slideRow label{font-size:13px;font-weight:600}.slideRow input{min-width:70px;max-width:260px;flex:1;min-height:30px;accent-color:var(--ink)}.slideRow output{font-size:12px;color:var(--label)}button,select{font:inherit;cursor:pointer;color:var(--ink);border-radius:7px;border:1px solid #a9b9a9;background:#fffdf4;min-height:40px;padding:6px 12px;font-weight:600}button:hover,select:hover{background:#eff2e8}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid #1974a1}
button[aria-pressed=true]{background:#dce8de;border-color:#5e7965}button:disabled{opacity:.42;cursor:default}button.primary{background:#204c3d;color:#fffdf3;border-color:#204c3d}
.panel{display:flex;flex-direction:column;padding:clamp(14px,2vw,28px);gap:13px;min-width:0}.statusHeading{justify-content:space-between;font-size:12px;font-weight:700;color:var(--label);letter-spacing:.025em}.nav{margin-top:auto;padding-top:10px}.nav select{flex:1 1 100%;width:100%;font-size:14px}.nav button{flex:1}.row{border-top:1px solid #dbe1d4;padding-top:10px}.row h3,.panel legend{font-size:13px;color:#4b6455;margin:0 0 3px;font-weight:650}.panel p{font-size:15px}.partActions{margin-top:5px}.partActions select{max-width:100%;font-size:13px}.checks{border:0;border-top:1px solid var(--border);margin:0;padding:10px 0 0}.checks legend{padding:0 5px 0 0}.checks label{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:14px}.checks input{accent-color:var(--ink);margin-top:4px;width:16px;height:16px;flex:none}.visuallyHidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
@media(max-width:750px){main{padding:7px}.layout{grid-template-columns:1fr}.scene{border-right:0;border-bottom:1px solid var(--border)}.viewport{min-height:255px;height:36vh;max-height:330px}.panel{gap:9px}.sceneTools,.slideRow{padding:5px 9px}.sceneTools button{min-height:42px;font-size:13px}.nav{display:grid;grid-template-columns:1fr 1fr}.nav select{grid-column:1/-1}.rev{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head>
<body><main><header><h1>PCB assembly</h1><span class="rev">Thai Waters · R0013 · Plate 7</span></header>
<div class="layout"><section class="scene" aria-label="Interactive assembly model">
<div class="viewport" id="stage"><canvas id="model" tabindex="0" aria-label="3D model. Drag to rotate, pinch or scroll to zoom. Use arrow keys to rotate."></canvas><span id="tag" class="tag" hidden></span><div class="legend"><span class="dot"></span>Current part</div></div>
<div class="slideRow"><label for="position">Part position</label><input type="range" id="position" min="0" max="100" value="50" aria-describedby="positionText"><output id="positionText" for="position"></output></div>
<div class="sceneTools"><button id="reset" type="button">Step view</button><button id="overview" type="button">Whole assembly</button><button id="focus" type="button">Zoom to part</button><button id="ghost" type="button" aria-pressed="false">See through case</button></div>
</section><section class="panel" aria-label="Assembly instructions"><div class="statusHeading"><span id="group"></span><span id="counter"></span></div><div aria-live="polite"><h2 id="title"></h2><p id="instruction"></p></div>
<div class="row"><h3>Orientation</h3><p id="facing"></p></div><div class="row"><h3>Check by hand</h3><p id="check"></p></div>
<div class="partActions" id="packs" hidden><label for="pack">Battery gauge</label><select id="pack"><option value="pkcell">PKCELL maximum</option><option value="adafruit">Adafruit 258</option></select></div>
<fieldset class="checks" id="checks" hidden><legend>Before closing</legend><div id="checkItems"></div></fieldset>
<nav class="nav" aria-label="Assembly steps"><label class="visuallyHidden" for="steps">Jump to a step</label><select id="steps"></select><button type="button" id="prev">Previous</button><button type="button" id="next" class="primary">Next step</button></nav>
</section></div></main><script type="application/json" id="assemblyData">@@DATA@@</script>
<script>@@APPLICATION@@</script></body></html>
